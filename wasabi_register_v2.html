<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D97706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="わさび食堂 レジ">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23D97706'/><rect x='6' y='10' width='20' height='14' rx='2.5' fill='white' opacity='.95'/><rect x='6' y='10' width='20' height='5' rx='2' fill='white'/><rect x='9' y='18' width='3' height='3' rx='.8' fill='%23D97706'/><rect x='14.5' y='18' width='3' height='3' rx='.8' fill='%23D97706'/><rect x='20' y='18' width='3' height='3' rx='.8' fill='%23D97706'/><rect x='13' y='6' width='6' height='5' rx='1' fill='white' opacity='.9'/><rect x='14.5' y='22' width='3' height='3' rx='.8' fill='%23B45309'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23D97706'/><rect x='30' y='58' width='120' height='82' rx='14' fill='white' opacity='.95'/><rect x='30' y='58' width='120' height='30' rx='14' fill='white'/><rect x='47' y='104' width='18' height='18' rx='5' fill='%23D97706'/><rect x='81' y='104' width='18' height='18' rx='5' fill='%23D97706'/><rect x='115' y='104' width='18' height='18' rx='5' fill='%23D97706'/><rect x='47' y='126' width='18' height='18' rx='5' fill='%23D97706' opacity='.4'/><rect x='81' y='126' width='18' height='18' rx='5' fill='%23B45309'/><rect x='115' y='126' width='18' height='18' rx='5' fill='%23D97706' opacity='.4'/><rect x='72' y='32' width='36' height='30' rx='6' fill='white' opacity='.9'/></svg>">
<title>わさび食堂 レジ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --amber:#D97706;--amber-d:#B45309;--amber-dd:#92400E;
  --amber-l:#F59E0B;--amber-ll:#FDE68A;--amber-bg:#FFFBEB;
  --bg:#FEFDF5;--white:#fff;
  --text:#1C1410;--text2:#44332A;--text3:#92816A;
  --border:#EDE8D8;--border2:#D4C89A;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --blue:#2563EB;--blue-bg:#EFF6FF;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow:0 2px 12px rgba(180,83,9,.12);
  --shadow-lg:0 8px 32px rgba(180,83,9,.18);
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}

/* ══════════════════ LAYOUT ══════════════════ */
.app{display:flex;flex-direction:column;height:100dvh;background:var(--white)}

/* タブレット横向き */
@media(min-width:768px){
  .app{flex-direction:row}
  .left-col{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
  .right-col{width:340px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
  .sp-header{display:none!important}
  .tab-header{display:flex!important}
  .sp-nav{display:none!important}
  .sp-panel{display:flex!important}
  .tab-panel{display:flex!important}
}
@media(max-width:767px){
  .left-col{display:flex;flex-direction:column;flex:1;overflow:hidden}
  .right-col{display:none}
  .tab-header{display:none!important}
  .tab-panel{display:none!important}
}

/* ══════════════════ HEADER ══════════════════ */
.sp-header{background:var(--amber);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tab-header{background:var(--amber);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-brand{display:flex;flex-direction:column}
.hdr-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:.04em}
.hdr-date{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px}
.hdr-clock{font-size:20px;font-weight:800;color:#fff;letter-spacing:.02em}
.hdr-order-no{font-size:11px;color:rgba(255,255,255,.8);text-align:right;margin-top:1px}

/* ══════════════════ SP NAV ══════════════════ */
.sp-nav{display:flex;background:var(--amber-dd);flex-shrink:0}
.sp-nav-btn{flex:1;height:56px;padding:0 4px;border:none;background:none;color:rgba(255,255,255,.55);font-size:10px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;border-bottom:3px solid transparent}
.sp-nav-btn .nav-ico{font-size:17px;line-height:1}
.sp-nav-btn.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1)}

/* ══════════════════ CAT TABS ══════════════════ */
.cat-bar{display:flex;gap:5px;padding:8px 10px 6px;background:var(--amber-bg);border-bottom:1px solid var(--amber-ll);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 8px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--white);font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .12s;min-width:56px}
.cat-btn-ico{font-size:15px}
.cat-btn.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.cat-btn.preset{border-color:var(--amber-l);color:var(--amber-d);background:var(--amber-bg)}
.cat-btn.preset.on{background:var(--amber-d);color:#fff;border-color:var(--amber-d)}

/* ══════════════════ PRODUCT GRID ══════════════════ */
.prod-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 16px}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:400px) and (max-width:767px){.prod-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.prod-grid{grid-template-columns:repeat(4,1fr)}}

.prod-btn{border:1.5px solid var(--border);border-radius:var(--radius-lg);background:var(--white);padding:9px 5px 8px;cursor:pointer;font-family:inherit;text-align:center;transition:transform .1s,background .1s,border-color .1s;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;justify-content:center;user-select:none;-webkit-user-select:none}
.prod-btn:active{transform:scale(.93);background:var(--amber-bg);border-color:var(--amber)}
.prod-btn.in-cart{background:var(--amber-bg);border-color:var(--amber-l)}
.prod-btn[data-div="shokudo"]{border-top:3px solid var(--amber)}
.prod-btn[data-div="coffee"]{border-top:3px solid var(--blue)}
.prod-btn[data-div="buppan"]{border-top:3px solid var(--green)}
.prod-name{font-size:10.5px;font-weight:700;color:var(--text);line-height:1.3;word-break:break-all}
.prod-price{font-size:10px;color:var(--text3);margin-top:1px}
.prod-price.vari{color:var(--amber-d);font-weight:800}
.cart-badge{position:absolute;top:-7px;right:-7px;background:var(--amber);color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--white);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ══════════════════ RIGHT PANEL (tablet) ══════════════════ */
.right-col{background:var(--white)}
.cart-hdr{padding:10px 12px 8px;border-bottom:1px solid var(--border);background:var(--amber-bg);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-hdr-title{font-size:12px;font-weight:800;color:var(--amber-dd);letter-spacing:.05em}
.cart-clear-btn{font-size:11px;color:var(--red);background:var(--red-bg);border:none;padding:5px 10px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:700}

/* 地元割トグル */
.local-row{display:flex;gap:4px;padding:6px 10px;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border)}
.local-btn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.local-btn.on-normal{background:var(--white);color:var(--text);border-color:var(--border2)}
.local-btn.on-local{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 2px 8px rgba(180,83,9,.3)}
.local-btn.off{background:none;color:var(--text3);border-color:var(--border)}

/* カートリスト */
.cart-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text3)}
.cart-empty-ico{font-size:38px;opacity:.35}
.cart-empty-txt{font-size:13px}

.cart-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--border);animation:slideIn .15s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-disc{font-size:10px;color:var(--amber-d);font-weight:700;background:var(--amber-bg);padding:1px 5px;border-radius:4px;display:inline-block;margin-top:2px}
.ci-ctrl{display:flex;align-items:center;gap:3px;flex-shrink:0}
.ci-btn{width:24px;height:24px;border:1.5px solid var(--border);border-radius:6px;background:var(--white);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-family:inherit;font-weight:700;flex-shrink:0}
.ci-btn.plus{border-color:var(--amber-l);color:var(--amber-d)}
.ci-btn.del{border-color:var(--red);color:var(--red);font-size:10px}
.ci-qty{width:26px;text-align:center;font-size:14px;font-weight:800;color:var(--text);flex-shrink:0}
.ci-price{font-size:13px;font-weight:800;color:var(--text);min-width:54px;text-align:right;flex-shrink:0}

/* 合計エリア */
.total-area{flex-shrink:0;background:var(--white);border-top:2px solid var(--border)}
.subtotal-rows{padding:8px 12px 0}
.sub-row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.sub-row .lbl{color:var(--text3)}
.sub-row .val{font-weight:700;color:var(--text2)}
.sub-row .disc{color:var(--green);font-weight:800}
.total-row-big{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 10px;border-top:1.5px solid var(--border);margin-top:6px}
.total-lbl{font-size:12px;font-weight:800;color:var(--amber-dd);letter-spacing:.04em}
.total-val{font-size:26px;font-weight:900;color:var(--amber-d)}

/* 会計ボタンエリア */
.checkout-area{padding:8px 10px 10px;background:var(--amber-bg);border-top:1px solid var(--amber-ll);flex-shrink:0}
.checkout-lbl{font-size:10px;font-weight:700;color:var(--amber-dd);letter-spacing:.08em;margin-bottom:5px}
.pay-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pay-btn{padding:12px 6px;border:none;border-radius:var(--radius-lg);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,opacity .1s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pay-btn:active{transform:scale(.96)}
.pay-btn:disabled{opacity:.4;cursor:default;transform:none}
.pay-btn.cash{background:var(--amber);color:#fff}
.pay-btn.paypay{background:#E00025;color:#fff}
.pay-btn.qr{background:var(--blue);color:#fff}
.pay-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pay-ico{font-size:16px}
.pay-lbl{font-size:10px;font-weight:700;letter-spacing:.03em}

/* 日次集計バー */
.daily-bar{background:var(--amber-dd);padding:7px 12px;flex-shrink:0}
.daily-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.daily-item{text-align:center}
.daily-lbl{font-size:8.5px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.04em}
.daily-val{font-size:13px;font-weight:900;color:#fff;margin-top:1px}

/* ══════════════════ SP: 会計パネル ══════════════════ */
.sp-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.sp-panel.show{display:flex}

/* ══════════════════ 履歴パネル ══════════════════ */
.hist-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.hist-panel.show{display:flex}
.hist-summary{background:var(--amber);padding:10px 14px;flex-shrink:0}
.hist-sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.hist-sum-item{text-align:center}
.hist-sum-lbl{font-size:9px;color:rgba(255,255,255,.75);font-weight:600}
.hist-sum-val{font-size:14px;font-weight:900;color:#fff;margin-top:1px}
.hist-list{padding:8px 10px 20px}
.hist-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;margin-bottom:7px}
.hist-card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.hist-no{font-size:10px;font-weight:800;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:20px}
.hist-time{font-size:12px;font-weight:700;color:var(--text2);flex:1}
.hist-pay-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.hist-pay-badge.cash{background:var(--amber-bg);color:var(--amber-d)}
.hist-pay-badge.paypay{background:#FFF0F2;color:#E00025}
.hist-pay-badge.qr{background:var(--blue-bg);color:var(--blue)}
.hist-total{font-size:16px;font-weight:900;color:var(--amber-d)}
.hist-local-badge{font-size:9px;font-weight:700;color:#fff;background:var(--amber-d);padding:2px 6px;border-radius:20px;margin-left:2px;vertical-align:middle;white-space:nowrap}
.hist-items{font-size:11px;color:var(--text3);line-height:1.7}
.hist-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--text3);padding:40px 0}

/* ══════════════════ MODALS ══════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:480px){.overlay{align-items:center}}
.modal{background:var(--white);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:420px;overflow:hidden;box-shadow:var(--shadow-lg);flex-shrink:0}
@media(min-width:480px){.modal{border-radius:var(--radius-xl)}}

/* 生わさびモーダル */
.pm-head{background:var(--amber-bg);padding:16px;border-bottom:1px solid var(--amber-ll)}
.pm-title{font-size:15px;font-weight:800;color:var(--amber-dd)}
.pm-sub{font-size:11px;color:var(--text3);margin-top:3px}
.pm-body{padding:14px}
.pm-display{background:var(--amber-bg);border:2px solid var(--amber);border-radius:var(--radius-lg);padding:10px 14px;text-align:right;font-size:28px;font-weight:900;color:var(--amber-d);margin-bottom:12px;min-height:54px;letter-spacing:.02em}
.pm-display.empty{color:var(--text3);font-size:18px;font-weight:500}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.nk{padding:13px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:background .1s;color:var(--text)}
.nk:active{background:var(--amber-bg)}
.nk.del{color:var(--red);font-size:14px}
.nk.zero{grid-column:span 2}
.nk.clr{font-size:12px;color:var(--text3)}
.pm-footer{display:flex;gap:8px}
.pm-cancel{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2)}
.pm-ok{flex:2;padding:12px;border:none;border-radius:var(--radius);background:var(--amber);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff}
.pm-ok:disabled{opacity:.4}

/* 会計モーダル（お釣り計算） */
.cm-head{padding:12px;text-align:center}
.cm-head.cash{background:var(--green)}
.cm-head.paypay{background:#E00025}
.cm-head.qr{background:var(--blue)}
.cm-ico{font-size:36px;margin-bottom:4px}
.cm-title{font-size:17px;font-weight:900;color:#fff}
.cm-subtitle{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}
.cm-body{padding:10px 14px}
.cm-total-box{text-align:center;padding:8px 0 8px;border-bottom:1px solid var(--border)}
.cm-total-lbl{font-size:10px;color:var(--text3);letter-spacing:.08em;font-weight:600}
.cm-total-val{font-size:28px;font-weight:900;color:var(--amber-d);margin-top:4px}

/* お釣り計算（現金時のみ） */
.change-area{padding:6px 0}
.change-lbl{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px}
.received-input-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.received-label{font-size:12px;color:var(--text3);white-space:nowrap}
.received-input{flex:1;padding:6px 10px;border:2px solid var(--amber);border-radius:var(--radius);font-size:16px;font-weight:800;text-align:right;font-family:inherit;color:var(--text);background:var(--amber-bg);outline:none}
.quick-bills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.bill-btn{padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2);transition:background .1s}
.bill-btn:active{background:var(--amber-bg);border-color:var(--amber)}
.change-result{background:var(--green-bg);border:1.5px solid var(--green);border-radius:var(--radius-lg);padding:8px;text-align:center;display:none}
.change-result.show{display:block}
.change-result-lbl{font-size:11px;color:var(--green);font-weight:600}
.change-result-val{font-size:22px;font-weight:900;color:var(--green);margin-top:3px}

.cm-items-list{border-top:1px solid var(--border);padding-top:6px;margin-top:2px}
.cm-item-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--text2)}
.cm-item-disc{color:var(--green)}
.cm-next-btn{width:100%;padding:12px;border:none;background:var(--amber);color:#fff;border-radius:var(--radius-lg);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px}

/* 同期中スピナー */
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:4px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════ 売上管理送信モーダル ══════════════════ */
.send-head{background:var(--amber);padding:16px 18px;display:flex;align-items:center;gap:10px}
.send-head-ico{font-size:24px}
.send-head-title{font-size:15px;font-weight:800;color:#fff}
.send-head-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:2px}
.send-body{padding:14px 16px;max-height:70vh;overflow-y:auto}
.send-summary{background:var(--amber-bg);border:1.5px solid var(--amber-ll);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:14px}
.send-summary-title{font-size:10px;font-weight:700;color:var(--amber-dd);letter-spacing:.06em;margin-bottom:8px}
.send-sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.send-sum-item{text-align:center;background:var(--white);border-radius:var(--radius);padding:7px 4px}
.send-sum-lbl{font-size:9px;color:var(--text3);font-weight:600}
.send-sum-val{font-size:13px;font-weight:900;color:var(--amber-d);margin-top:2px}
.send-sum-val.cash-col{color:var(--green)}
.send-field{margin-bottom:12px}
.send-field-lbl{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.send-field-lbl .req{font-size:9px;background:var(--red);color:#fff;padding:1px 4px;border-radius:3px;font-weight:700}
.send-select,.send-input,.send-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--white);color:var(--text);outline:none;-webkit-appearance:none}
.send-select:focus,.send-input:focus,.send-textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.12)}
.send-textarea{resize:none;height:60px;font-size:13px}
.weather-btns{display:flex;gap:6px;flex-wrap:wrap}
.weather-btn{padding:7px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--text2);transition:all .12s}
.weather-btn.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-d)}
.send-prod-list{background:var(--bg);border-radius:var(--radius);padding:8px 10px;font-size:11px;color:var(--text3);line-height:1.9;max-height:100px;overflow-y:auto;border:1px solid var(--border)}
.send-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--white)}
.send-cancel{flex:1;padding:13px;border:1.5px solid var(--border);border-radius:var(--radius-lg);background:var(--white);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2)}
.send-ok{flex:2;padding:13px;border:none;border-radius:var(--radius-lg);background:var(--amber);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.send-ok:disabled{opacity:.4;cursor:default}
.send-ok.sending{background:var(--amber-d)}
/* 送信完了バナー */
.sent-banner{background:var(--green-bg);border:1.5px solid var(--green);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;display:none}
.sent-banner.show{display:flex}
.sent-banner-ico{font-size:20px}
.sent-banner-txt{font-size:12px;font-weight:700;color:var(--green)}

/* ══════════════════ 商品マスタ編集パネル ══════════════════ */
.master-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;background:var(--bg)}
.master-panel.show{display:flex}
.master-head{background:var(--amber);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.master-head-title{font-size:13px;font-weight:800;color:#fff}
.master-add-btn{background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-family:inherit}
.master-cat-tabs{display:flex;background:var(--amber-dd);flex-shrink:0}
.master-cat-btn{flex:1;padding:8px 4px;border:none;background:none;color:rgba(255,255,255,.6);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent}
.master-cat-btn.on{color:#fff;border-bottom-color:#fff}
.master-list{padding:8px 10px 20px}
.master-item{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.master-item-info{flex:1;min-width:0}
.master-item-name{font-size:13px;font-weight:700;color:var(--text)}
.master-item-meta{font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:8px}
.master-item-div{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:700}
.master-item-div.shokudo{background:var(--amber-bg);color:var(--amber-d)}
.master-item-div.coffee{background:#FEF3C7;color:#92400E}
.master-item-div.buppan{background:var(--green-bg);color:var(--green)}
.master-edit-btn{padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2);white-space:nowrap}
.master-del-btn{padding:6px 10px;border:1.5px solid var(--red);border-radius:var(--radius);background:var(--red-bg);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--red);white-space:nowrap}
/* 商品編集モーダル */
.medit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.medit-modal{background:var(--white);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:480px;overflow:hidden}
.medit-head{background:var(--amber-bg);padding:14px 16px;border-bottom:1px solid var(--amber-ll);display:flex;align-items:center;justify-content:space-between}
.medit-title{font-size:14px;font-weight:800;color:var(--amber-dd)}
.medit-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:0 4px}
.medit-body{padding:14px 16px}
.medit-field{margin-bottom:12px}
.medit-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}
.medit-input,.medit-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--white);color:var(--text);outline:none;-webkit-appearance:none}
.medit-input:focus,.medit-select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.12)}
.medit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medit-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.medit-cancel{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-lg);background:var(--white);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2)}
.medit-save{flex:2;padding:12px;border:none;border-radius:var(--radius-lg);background:var(--amber);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff}
/* ══════════════════ プリセット編集 ══════════════════ */
.preset-section{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
.preset-section-head{background:var(--amber-bg);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--amber-ll)}
.preset-section-title{font-size:12px;font-weight:800;color:var(--amber-dd)}
.preset-rename-btn{font-size:11px;color:var(--amber-d);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;padding:2px 6px}
.preset-prod-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px}
.preset-prod-row:last-child{border-bottom:none}
.preset-check{width:20px;height:20px;accent-color:var(--amber);flex-shrink:0;cursor:pointer}
.preset-prod-name{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.preset-prod-price{font-size:11px;color:var(--text3);white-space:nowrap}
.preset-order-btns{display:flex;gap:3px;flex-shrink:0}
.preset-ob{width:26px;height:26px;border:1.5px solid var(--border);border-radius:6px;background:var(--white);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.preset-ob:active{background:var(--amber-bg)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(28,20,16,.88);color:#fff;padding:9px 18px;border-radius:30px;font-size:12px;font-weight:700;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px)}
.toast.show{opacity:1}

/* スクロールバー */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ════════════ LEFT COL ════════════ -->
  <div class="left-col">

    <!-- スマホヘッダー -->
    <div class="sp-header">
      <div class="hdr-brand">
        <div class="hdr-title">🌿 わさび食堂 レジ</div>
        <div class="hdr-date" id="sp-date"></div>
      </div>
      <div style="text-align:right">
        <div class="hdr-clock" id="sp-clock"></div>
        <div class="hdr-order-no" id="sp-order-no"></div>
      </div>
    </div>

    <!-- スマホナビ -->
    <div class="sp-nav">
      <button class="sp-nav-btn on" id="snav-menu" onclick="spSwitch('menu')">
        <span class="nav-ico">🛒</span>商品
      </button>
      <button class="sp-nav-btn" id="snav-cart" onclick="spSwitch('cart')">
        <span class="nav-ico">🧾</span><span id="cart-nav-label">カート</span>
      </button>
      <button class="sp-nav-btn" id="snav-hist" onclick="spSwitch('hist')">
        <span class="nav-ico">📋</span>履歴
      </button>
      <button class="sp-nav-btn" id="snav-master" onclick="spSwitch('master')">
        <span class="nav-ico">⚙️</span>マスタ
      </button>
      <button class="sp-nav-btn" id="snav-send" onclick="openSendModal()">
        <span class="nav-ico">📤</span>売上送信
      </button>
    </div>

    <!-- カテゴリタブ（商品パネル時のみ） -->
    <div class="cat-bar" id="cat-bar">
      <button class="cat-btn preset on" id="cat-btn-preset-0" onclick="setCat('preset-0')">
        <span class="cat-btn-ico">⭐</span><span id="preset-0-label">奥多摩</span>
      </button>
      <button class="cat-btn preset" id="cat-btn-preset-1" onclick="setCat('preset-1')">
        <span class="cat-btn-ico">🎪</span><span id="preset-1-label">イベント</span>
      </button>
      <button class="cat-btn" data-cat="フード" onclick="setCat('フード')">
        <span class="cat-btn-ico">🍚</span>フード
      </button>
      <button class="cat-btn" data-cat="ドリンク" onclick="setCat('ドリンク')">
        <span class="cat-btn-ico">☕</span>ドリンク
      </button>
      <button class="cat-btn" data-cat="物販" onclick="setCat('物販')">
        <span class="cat-btn-ico">🛍</span>物販
      </button>
    </div>

    <!-- 商品グリッドパネル -->
    <div class="prod-area" id="prod-panel">
      <div class="prod-grid" id="prod-grid"></div>
    </div>

    <!-- SP: 会計パネル -->
    <div class="sp-panel" id="sp-cart-panel"></div>

    <!-- SP: 履歴パネル -->
    <div class="hist-panel" id="sp-hist-panel"></div>

    <!-- SP: 商品マスタ編集パネル -->
    <div class="master-panel" id="sp-master-panel">
      <div class="master-head">
        <div class="master-head-title">⚙️ 商品マスタ編集</div>
        <button class="master-add-btn" id="master-action-btn" onclick="openMasterEdit(null)">＋ 新規追加</button>
      </div>
      <div class="master-cat-tabs">
        <button class="master-cat-btn on" data-mcat="フード" onclick="setMasterCat('フード')">🍚 フード</button>
        <button class="master-cat-btn" data-mcat="ドリンク" onclick="setMasterCat('ドリンク')">☕ ドリンク</button>
        <button class="master-cat-btn" data-mcat="物販" onclick="setMasterCat('物販')">🛍 物販</button>
        <button class="master-cat-btn" data-mcat="preset" onclick="setMasterCat('preset')">⭐ プリセット</button>
      </div>
      <div class="master-list" id="master-list"></div>
    </div>

  </div>

  <!-- ════════════ RIGHT COL (tablet) ════════════ -->
  <div class="right-col" id="right-col">
    <!-- タブレットヘッダー -->
    <div class="tab-header">
      <div class="hdr-brand">
        <div class="hdr-title">🌿 わさび食堂 レジ</div>
        <div class="hdr-date" id="tab-date"></div>
      </div>
      <div style="text-align:right">
        <div class="hdr-clock" id="tab-clock"></div>
        <div class="hdr-order-no" id="tab-order-no"></div>
      </div>
    </div>

    <!-- カートヘッダー -->
    <div class="cart-hdr">
      <div class="cart-hdr-title">🧾 注文カート</div>
      <button class="cart-clear-btn" onclick="clearCart()">全クリア</button>
    </div>

    <!-- 地元割 -->
    <div class="local-row" id="tab-local-row">
      <button class="local-btn on-normal" id="tab-btn-normal" onclick="setLocal(false)">通常料金</button>
      <button class="local-btn off" id="tab-btn-local" onclick="setLocal(true)">🏔 地元割</button>
    </div>

    <!-- カートリスト -->
    <div class="cart-list" id="tab-cart-list">
      <div class="cart-empty">
        <div class="cart-empty-ico">🛒</div>
        <div class="cart-empty-txt">商品を選んでください</div>
      </div>
    </div>

    <!-- 合計 -->
    <div class="total-area">
      <div class="subtotal-rows" id="tab-subtotal-rows"></div>
      <div class="total-row-big">
        <div class="total-lbl">合計（税込）</div>
        <div class="total-val" id="tab-total-val">¥0</div>
      </div>
    </div>

    <!-- 会計ボタン -->
    <div class="checkout-area">
      <div class="checkout-lbl">支払方法を選択して会計</div>
      <div class="pay-btns">
        <button class="pay-btn cash" id="tab-pay-cash" onclick="openCheckout('cash')">
          <span class="pay-ico">💴</span>
          <span class="pay-lbl">現金</span>
        </button>
        <button class="pay-btn paypay" id="tab-pay-paypay" onclick="openCheckout('paypay')">
          <span class="pay-ico">🔴</span>
          <span class="pay-lbl">PayPay</span>
        </button>
        <button class="pay-btn qr" id="tab-pay-qr" onclick="openCheckout('qr')">
          <span class="pay-ico">💳</span>
          <span class="pay-lbl">R Pay</span>
        </button>
      </div>
    </div>

    <!-- 日次集計 -->
    <div class="daily-bar" id="tab-daily-bar">
      <div class="daily-grid" id="tab-daily-grid"></div>
      <button onclick="openSendModal()" style="width:100%;margin-top:8px;padding:9px;border:1.5px solid rgba(255,255,255,.4);border-radius:var(--radius);background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.04em">
        📤 売上管理アプリに送る
      </button>
    </div>

    <!-- タブレット用簡易履歴 -->
    <div class="tab-panel" style="flex:1;overflow-y:auto;background:var(--bg);padding:6px 8px" id="tab-hist-list"></div>

  </div>
</div>

<!-- ════════ 生わさびモーダル ════════ -->
<div class="overlay" id="price-modal" style="display:none" onclick="if(event.target===this)closePriceModal()">
  <div class="modal">
    <div class="pm-head">
      <div class="pm-title">🌿 生わさびの金額</div>
      <div class="pm-sub">今回の生わさびの販売金額を入力してください</div>
    </div>
    <div class="pm-body">
      <div class="pm-display empty" id="pm-display">金額を入力</div>
      <div class="numpad">
        <button class="nk" onclick="pmKey('7')">7</button>
        <button class="nk" onclick="pmKey('8')">8</button>
        <button class="nk" onclick="pmKey('9')">9</button>
        <button class="nk" onclick="pmKey('4')">4</button>
        <button class="nk" onclick="pmKey('5')">5</button>
        <button class="nk" onclick="pmKey('6')">6</button>
        <button class="nk" onclick="pmKey('1')">1</button>
        <button class="nk" onclick="pmKey('2')">2</button>
        <button class="nk" onclick="pmKey('3')">3</button>
        <button class="nk clr" onclick="pmKey('C')">クリア</button>
        <button class="nk zero" onclick="pmKey('0')">0</button>
        <button class="nk del" onclick="pmKey('D')">⌫</button>
      </div>
      <div class="pm-footer">
        <button class="pm-cancel" onclick="closePriceModal()">キャンセル</button>
        <button class="pm-ok" id="pm-ok" onclick="confirmPrice()" disabled>カートへ追加</button>
      </div>
    </div>
  </div>
</div>

<!-- ════════ 会計モーダル ════════ -->
<div class="overlay" id="checkout-modal" style="display:none" onclick="if(event.target===this)closeCheckout()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="cm-head" id="cm-head">
      <div class="cm-ico" id="cm-ico"></div>
      <div class="cm-title" id="cm-title"></div>
      <div class="cm-subtitle" id="cm-subtitle"></div>
    </div>
    <div class="cm-body">
      <div class="cm-total-box">
        <div class="cm-total-lbl">お会計金額</div>
        <div class="cm-total-val" id="cm-total-val"></div>
      </div>

      <!-- 現金用：お釣り計算 -->
      <div class="change-area" id="change-area" style="display:none">
        <div class="change-lbl">💴 お釣り計算</div>
        <div class="received-input-row">
          <span class="received-label">お預かり</span>
          <input class="received-input" id="received-input" type="text" inputmode="numeric" placeholder="0" oninput="calcChange()">
        </div>
        <div class="quick-bills" id="quick-bills"></div>
        <div class="change-result" id="change-result">
          <div class="change-result-lbl">お釣り</div>
          <div class="change-result-val" id="change-val"></div>
        </div>
      </div>

      <div class="cm-items-list" id="cm-items-list"></div>
      <button class="cm-next-btn" id="cm-next-btn" onclick="completeCheckout()">
        会計完了 → 次の注文へ
      </button>
    </div>
  </div>
</div>

<!-- ════════ 売上管理送信モーダル ════════ -->
<div class="overlay" id="send-modal" style="display:none" onclick="if(event.target===this)closeSendModal()">
  <div class="modal" style="border-radius:var(--radius-xl) var(--radius-xl) 0 0;max-width:480px" onclick="event.stopPropagation()">
    <div class="send-head">
      <div class="send-head-ico">📤</div>
      <div>
        <div class="send-head-title">売上管理アプリに送る</div>
        <div class="send-head-sub" id="send-head-date"></div>
      </div>
    </div>
    <div class="send-body">
      <!-- 送信完了バナー -->
      <div class="sent-banner" id="sent-banner">
        <span class="sent-banner-ico">✅</span>
        <span class="sent-banner-txt">売上管理アプリへの送信が完了しました</span>
      </div>

      <!-- 本日集計サマリー -->
      <div class="send-summary">
        <div class="send-summary-title">本日の売上サマリー</div>
        <div class="send-sum-grid" id="send-sum-grid"></div>
      </div>

      <!-- 場所 -->
      <div class="send-field">
        <div class="send-field-lbl">出店場所 <span class="req">必須</span></div>
        <select class="send-select" id="send-loc">
          <option value="奥多摩駅前">🏔 奥多摩駅前</option>
          <option value="イベント">🎪 イベント</option>
        </select>
      </div>

      <!-- イベント名（イベント時のみ表示） -->
      <div class="send-field" id="send-event-field" style="display:none">
        <div class="send-field-lbl">イベント名</div>
        <input class="send-input" id="send-event" type="text" placeholder="例：まいたけ祭">
      </div>

      <!-- 天気 -->
      <div class="send-field">
        <div class="send-field-lbl">天気</div>
        <div class="weather-btns" id="weather-btns">
          <button class="weather-btn" data-w="晴れ" onclick="setWeather('晴れ')">☀️ 晴れ</button>
          <button class="weather-btn" data-w="くもり" onclick="setWeather('くもり')">☁️ くもり</button>
          <button class="weather-btn" data-w="雨" onclick="setWeather('雨')">🌧 雨</button>
          <button class="weather-btn" data-w="雪" onclick="setWeather('雪')">❄️ 雪</button>
          <button class="weather-btn" data-w="" onclick="setWeather('')">— 未記入</button>
        </div>
      </div>

      <!-- メモ -->
      <div class="send-field">
        <div class="send-field-lbl">メモ</div>
        <textarea class="send-textarea" id="send-memo" placeholder="例：ヒルナンデス放送翌日、人が多かった…"></textarea>
      </div>

      <!-- 商品内訳プレビュー -->
      <div class="send-field">
        <div class="send-field-lbl">商品内訳プレビュー</div>
        <div class="send-prod-list" id="send-prod-preview"></div>
      </div>
    </div>
    <div class="send-footer">
      <button class="send-cancel" onclick="closeSendModal()">キャンセル</button>
      <button class="send-ok" id="send-ok-btn" onclick="executeSend()">
        <span id="send-ok-ico">📤</span>
        <span id="send-ok-txt">売上管理に送る</span>
      </button>
    </div>
  </div>
</div>

<!-- ════════ 商品マスタ編集モーダル ════════ -->
<div class="medit-overlay" id="medit-modal" style="display:none" onclick="if(event.target===this)closeMasterEdit()">
  <div class="medit-modal" onclick="event.stopPropagation()">
    <div class="medit-head">
      <div class="medit-title" id="medit-title">商品を追加</div>
      <button class="medit-close" onclick="closeMasterEdit()">✕</button>
    </div>
    <div class="medit-body">
      <input type="hidden" id="medit-id">
      <input type="hidden" id="medit-orig-id">
      <div class="medit-field">
        <label class="medit-label">商品名 <span style="color:var(--red)">*</span></label>

<script>
'use strict';

// ══════════════════════════════════════════
//  GAS URL
// ══════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyWGZqabQdPqQpwRJbCU4oejikCkHTNVG2nDSdO11ZQRZQMaxXP-YYwS2GbJW-Yxjgy7w/exec';

// ══════════════════════════════════════════
//  商品マスタ
// ══════════════════════════════════════════
const PRODS = {
  フード: [
    {id:'wasabi_don',  name:'わさび丼',        price:900,  disc:200, div:'shokudo'},
    {id:'mini_don',    name:'ミニわさび丼',      price:700,  disc:200, div:'shokudo'},
    {id:'pork_don',    name:'わさびポーク丼',    price:1100, disc:200, div:'shokudo'},
    {id:'inari',       name:'わさびいなり',      price:500,  disc:100, div:'shokudo'},
    {id:'onigiri',     name:'わさびおにぎり',    price:500,  disc:100, div:'shokudo'},
    {id:'sausage_dog', name:'ソーセージドッグ',  price:1200, disc:200, div:'shokudo'},
    {id:'sausage',     name:'わさびソーセージ',  price:1000, disc:0,   div:'shokudo'},
    {id:'roast',       name:'おつまみロース',    price:1000, disc:0,   div:'shokudo'},
  ],
  ドリンク: [
    {id:'wasabi_coffee', name:'わさびコーヒー',      price:750, disc:0, div:'coffee'},
    {id:'orig_blend',    name:'オリジナルブレンド',   price:550, disc:0, div:'coffee'},
    {id:'decaf',         name:'Decaf Coffee',        price:550, disc:0, div:'coffee'},
    {id:'passage',       name:'Passage Coffee',      price:650, disc:0, div:'coffee'},
    {id:'peach_soda',    name:'わさびピーチソーダ',   price:600, disc:0, div:'coffee'},
    {id:'yuzu',          name:'ゆず茶',              price:500, disc:0, div:'coffee'},
    {id:'drip1',         name:'ドリップ×1',          price:200, disc:0, div:'coffee'},
    {id:'drip3',         name:'ドリップ×3',          price:500, disc:0, div:'coffee'},
  ],
  物販: [
    {id:'fresh_wasabi', name:'生わさび',          price:null, disc:0, div:'buppan'},
    {id:'cookie_s',     name:'クッキー（小）',     price:350,  disc:0, div:'coffee'},
    {id:'cookie_l',     name:'クッキー（大）',     price:550,  disc:0, div:'coffee'},
    {id:'snowball',     name:'スノーボール',       price:400,  disc:0, div:'coffee'},
    {id:'wappen',       name:'わさびワッペン',     price:660,  disc:0, div:'buppan'},
    {id:'mask',         name:'フェイスマスク',     price:660,  disc:0, div:'buppan'},
    {id:'wasabee',      name:'わさぴー',           price:660,  disc:0, div:'buppan'},
    {id:'bag',          name:'手さげ袋',           price:10,   disc:0, div:'buppan'},
  ]
};
const ALL_PRODS = Object.values(PRODS).flat();
const findProd = id => ALL_PRODS.find(p => p.id === id);

// ══════════════════════════════════════════
//  状態
// ══════════════════════════════════════════
let cart = [];
let isLocal = false;
let activeCat = 'フード';
let spView = 'menu'; // menu | cart | hist
let pmVal = '';
let currentPayment = null; // checkout中の支払方法

const STORAGE_KEY = 'wasabi_reg_v2';

// 本日データ（端末ローカル分）
let todayData = loadTodayData();
// GASから取得した全端末の集計（複数端末対応）
let gasOrders = [];      // GASから取得した注文一覧
let gasSummary = null;   // GASから取得した集計
let gasLastFetched = 0;  // 最終取得時刻
const GAS_FETCH_INTERVAL = 30000; // 30秒ごとに更新

function loadTodayData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  const d = raw ? JSON.parse(raw) : null;
  const today = todayStr();
  if (d && d.date === today) return d;
  return { date: today, orders: [], nextNo: 1 };
}

function saveTodayData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todayData));
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

const fmt = n => '¥' + Math.round(n).toLocaleString();

function fmtOrderTime(t) {
  if (!t) return '';
  if (typeof t === 'string' && t.length <= 5) return t;
  try {
    const d = new Date(t);
    if (!isNaN(d)) return d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {}
  return String(t).replace(/.*?(\d{2}:\d{2}).*/, '$1') || String(t);
}

// ══════════════════════════════════════════
//  GAS日次集計取得（複数端末対応）
// ══════════════════════════════════════════
async function fetchGasSummary(force = false) {
  if (!GAS_URL) return;
  const now = Date.now();
  if (!force && now - gasLastFetched < GAS_FETCH_INTERVAL) return;
  gasLastFetched = now;

  try {
    const url = `${GAS_URL}?action=getDailySummary&date=${todayStr()}`;
    const res  = await fetch(url);
    const json = await res.json();
    if (json.success) {
      gasOrders  = json.orders  || [];
      gasSummary = json.summary || null;

      // nextNo をGASの最大注文番号+1に同期（端末間ズレ防止）
      if (gasOrders.length > 0) {
        const maxNo = Math.max(...gasOrders.map(o => o.no || 0));
        // 自端末のnextNoがGASより小さければ更新
        if (todayData.nextNo <= maxNo) {
          todayData.nextNo = maxNo + 1;
          saveTodayData();
          updateOrderNo();
        }
      }
      renderDailySummary();
      renderTabHist();
      if (spView === 'hist') renderSpHist();
    }
  } catch(e) {
    console.warn('GAS集計取得エラー:', e);
  }
}

// GASから取得した全端末の注文を合算して表示
function getMergedSummary() {
  // GAS取得済みなら使う（全端末合算）、なければローカルのみ
  if (gasSummary) return gasSummary;
  // ローカルフォールバック
  const orders = todayData.orders;
  return {
    total:  orders.reduce((s,o) => s+o.total, 0),
    cash:   orders.filter(o=>o.payment==='cash').reduce((s,o) => s+o.total, 0),
    paypay: orders.filter(o=>o.payment==='paypay').reduce((s,o) => s+o.total, 0),
    qr:     orders.filter(o=>o.payment==='qr').reduce((s,o) => s+o.total, 0),
    count:  orders.length
  };
}

function getMergedOrders() {
  // GAS取得済みなら全端末分を使う
  if (gasOrders.length > 0) return [...gasOrders].reverse();
  return [...todayData.orders].reverse();
}

// ══════════════════════════════════════════
//  時計
// ══════════════════════════════════════════
function tick() {
  const now = new Date();
  const time = now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  const date = now.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric', weekday:'short'});
  setTxt('sp-clock', time);
  setTxt('tab-clock', time);
  setTxt('sp-date', date);
  setTxt('tab-date', date);
}
function setTxt(id, v) { const e = document.getElementById(id); if(e) e.textContent = v; }
tick();
setInterval(tick, 1000);

// 注文番号表示
function updateOrderNo() {
  const no = `次の注文番号: #${todayData.nextNo}`;
  setTxt('sp-order-no', no);
  setTxt('tab-order-no', no);
}
updateOrderNo();

// ══════════════════════════════════════════
//  カテゴリ・プリセット
// ══════════════════════════════════════════
const PRESET_KEY = 'wasabi_presets_v1';
const MASTER_CACHE_KEY = 'wasabi_master_v1_cache';

const DEFAULT_PRESETS = [
  {
    id: 'preset-0',
    label: '奥多摩',
    icon: '⭐',
    items: ['wasabi_don','mini_don','pork_don','inari','onigiri','sausage_dog',
            'wasabi_coffee','orig_blend','yuzu','fresh_wasabi','cookie_s','cookie_l']
  },
  {
    id: 'preset-1',
    label: 'イベント',
    icon: '🎪',
    items: ['mini_don','inari','onigiri','wasabi_coffee','yuzu']
  }
];

function loadPresets() {
  try {
    const raw = localStorage.getItem(PRESET_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_PRESETS;
  } catch(e) { return DEFAULT_PRESETS; }
}

function savePresets(presets) {
  // localStorageにキャッシュ
  localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
  // GASにも保存（非同期・失敗しても無視）
  if (GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'savePresets', presets })
    }).catch(() => {});
  }
}

function loadCustomProds() {
  try {
    const raw = localStorage.getItem(MASTER_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveCustomProds(data) {
  // localStorageにキャッシュ
  localStorage.setItem(MASTER_KEY, JSON.stringify(data));
  // GASにも保存（非同期・失敗しても無視）
  if (GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveMaster', master: data })
    }).catch(() => {});
  }
}

// GASから設定を取得して全端末で同期
async function syncSettingsFromGAS() {
  if (!GAS_URL) return;
  try {
    const res  = await fetch(`${GAS_URL}?action=getSettings`);
    const json = await res.json();
    if (!json.success) return;

    let updated = false;

    // プリセット同期
    if (json.presets && Array.isArray(json.presets)) {
      localStorage.setItem(PRESET_KEY, JSON.stringify(json.presets));
      presets = json.presets;
      applyPresetLabels();
      if (activeCat.startsWith('preset-')) renderGrid();
      updated = true;
    }

    // カスタム商品マスタ同期
    if (json.master && typeof json.master === 'object') {
      localStorage.setItem(MASTER_KEY, JSON.stringify(json.master));
      // PRODSに再反映
      applyCustomProds();
      renderGrid();
      updated = true;
    }

    if (updated) {
      console.log('設定をGASから同期しました');
    }
  } catch(e) {
    console.warn('設定同期エラー:', e);
  }
}

let presets = loadPresets();

// プリセットラベルをタブに反映
function applyPresetLabels() {
  presets.forEach((preset, i) => {
    const lbl = document.getElementById(`preset-${i}-label`);
    if (lbl) lbl.textContent = preset.label;
    const btn = document.getElementById(`cat-btn-preset-${i}`);
    if (btn) {
      const ico = btn.querySelector('.cat-btn-ico');
      if (ico) ico.textContent = preset.icon || '⭐';
    }
  });
}

function setCat(cat) {
  activeCat = cat;
  // 全タブのon解除
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('on'));
  // 対象タブをon
  if (cat.startsWith('preset-')) {
    document.getElementById(`cat-btn-${cat}`)?.classList.add('on');
  } else {
    document.querySelectorAll(`.cat-btn[data-cat="${cat}"]`).forEach(b => b.classList.add('on'));
  }
  renderGrid();
}

// ══════════════════════════════════════════
//  商品グリッド
// ══════════════════════════════════════════
function renderGrid() {
  const g = document.getElementById('prod-grid');
  if (!g) return;

  let prods;
  if (activeCat.startsWith('preset-')) {
    const idx = parseInt(activeCat.replace('preset-', ''));
    const preset = presets[idx];
    if (!preset) { g.innerHTML = ''; return; }
    // プリセットの順番通りに商品を並べる
    prods = preset.items
      .map(id => ALL_PRODS.find(p => p.id === id))
      .filter(Boolean);
  } else {
    prods = PRODS[activeCat] || [];
  }

  g.innerHTML = prods.map(p => {
    const qty = cart.find(c => c.id === p.id)?.qty || 0;
    const priceLabel = p.price === null ? '価格変動' : fmt(p.price);
    return `<button class="prod-btn${qty > 0 ? ' in-cart' : ''}" data-div="${p.div || 'shokudo'}"
      onclick="addItem('${p.id}')" ontouchstart="">
      ${qty > 0 ? `<div class="cart-badge">${qty}</div>` : ''}
      <div class="prod-name">${p.name}</div>
      <div class="prod-price${p.price === null ? ' vari' : ''}">${priceLabel}</div>
    </button>`;
  }).join('');
}

// ══════════════════════════════════════════
//  カート操作
// ══════════════════════════════════════════
function addItem(id) {
  const p = findProd(id);
  if (!p) return;
  if (p.price === null) { openPriceModal(); return; }
  const ex = cart.find(c => c.id === id);
  if (ex) {
    ex.qty++;
  } else {
    cart.push({ id, name: p.name, qty: 1, unitPrice: p.price, disc: p.disc });
  }
  renderAll();
}

function changeQty(id, delta) {
  const i = cart.findIndex(c => c.id === id);
  if (i === -1) return;
  cart[i].qty += delta;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  renderAll();
}

function removeItem(id) {
  cart = cart.filter(c => c.id !== id);
  renderAll();
}

function clearCart() {
  if (!cart.length) return;
  if (!confirm('カートを空にしますか？')) return;
  cart = [];
  isLocal = false;
  renderAll();
}

function setLocal(val) {
  isLocal = val;
  // タブレット
  const nb = document.getElementById('tab-btn-normal');
  const lb = document.getElementById('tab-btn-local');
  if (nb) { nb.className = val ? 'local-btn off' : 'local-btn on-normal'; }
  if (lb) { lb.className = val ? 'local-btn on-local' : 'local-btn off'; }
  renderAll();
}

// ══════════════════════════════════════════
//  合計計算
// ══════════════════════════════════════════
function calcTotals() {
  let subtotal = 0, discount = 0;
  cart.forEach(item => {
    subtotal += item.unitPrice * item.qty;
    if (isLocal) discount += item.disc * item.qty;
  });
  return { subtotal, discount, total: subtotal - discount };
}

// ══════════════════════════════════════════
//  描画：カートリスト（タブレット）
// ══════════════════════════════════════════
function renderTabCart() {
  const el = document.getElementById('tab-cart-list');
  if (!el) return;
  if (!cart.length) {
    el.innerHTML = `<div class="cart-empty"><div class="cart-empty-ico">🛒</div><div class="cart-empty-txt">商品を選んでください</div></div>`;
    return;
  }
  el.innerHTML = cart.map(item => {
    const disc = isLocal ? item.disc : 0;
    const linePrice = (item.unitPrice - disc) * item.qty;
    return `<div class="cart-item">
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        ${isLocal && item.disc > 0 ? `<div class="ci-disc">地元割 -${fmt(item.disc)}</div>` : ''}
      </div>
      <div class="ci-ctrl">
        <button class="ci-btn del" onclick="removeItem('${item.id}')">✕</button>
        <button class="ci-btn" onclick="changeQty('${item.id}',-1)">－</button>
        <div class="ci-qty">${item.qty}</div>
        <button class="ci-btn plus" onclick="changeQty('${item.id}',1)">＋</button>
      </div>
      <div class="ci-price">${fmt(linePrice)}</div>
    </div>`;
  }).join('');
}

function renderTabTotal() {
  const { subtotal, discount, total } = calcTotals();
  const sr = document.getElementById('tab-subtotal-rows');
  const tv = document.getElementById('tab-total-val');
  if (sr) sr.innerHTML = discount > 0
    ? `<div class="sub-row"><span class="lbl">小計</span><span class="val">${fmt(subtotal)}</span></div>
       <div class="sub-row"><span class="lbl">🏔 地元割</span><span class="disc">-${fmt(discount)}</span></div>`
    : '';
  if (tv) tv.textContent = fmt(total);
  // 会計ボタン disabled 制御
  const hasCart = cart.length > 0;
  ['tab-pay-cash','tab-pay-paypay','tab-pay-qr'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !hasCart;
  });
}

// ══════════════════════════════════════════
//  SP: 会計パネル描画
// ══════════════════════════════════════════
function renderSpCart() {
  const el = document.getElementById('sp-cart-panel');
  if (!el) return;
  const { subtotal, discount, total } = calcTotals();
  const hasCart = cart.length > 0;
  const discHtml = discount > 0
    ? `<div class="sub-row"><span class="lbl">小計</span><span class="val">${fmt(subtotal)}</span></div>
       <div class="sub-row"><span class="lbl">🏔 地元割</span><span class="disc">-${fmt(discount)}</span></div>` : '';
  const cartHtml = !hasCart
    ? `<div class="cart-empty" style="height:120px"><div class="cart-empty-ico">🛒</div><div class="cart-empty-txt">商品を選んでください</div></div>`
    : cart.map(item => {
        const disc = isLocal ? item.disc : 0;
        return `<div class="cart-item">
          <div class="ci-info">
            <div class="ci-name">${item.name}</div>
            ${isLocal && item.disc > 0 ? `<div class="ci-disc">地元割 -${fmt(item.disc)}</div>` : ''}
          </div>
          <div class="ci-ctrl">
            <button class="ci-btn del" onclick="removeItem('${item.id}');renderSpCart()">✕</button>
            <button class="ci-btn" onclick="changeQty('${item.id}',-1);renderSpCart()">－</button>
            <div class="ci-qty">${item.qty}</div>
            <button class="ci-btn plus" onclick="changeQty('${item.id}',1);renderSpCart()">＋</button>
          </div>
          <div class="ci-price">${fmt((item.unitPrice-(isLocal?item.disc:0))*item.qty)}</div>
        </div>`;
      }).join('');

  el.innerHTML = `
    <div style="background:var(--amber-bg);border-bottom:1px solid var(--amber-ll);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <span style="font-size:12px;font-weight:800;color:var(--amber-dd)">🧾 注文カート</span>
      <button class="cart-clear-btn" onclick="clearCart();renderSpCart()">全クリア</button>
    </div>
    <div style="display:flex;gap:4px;padding:6px 10px;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border)">
      <button class="local-btn ${isLocal?'off':'on-normal'}" onclick="setLocal(false);renderSpCart()">通常料金</button>
      <button class="local-btn ${isLocal?'on-local':'off'}" onclick="setLocal(true);renderSpCart()">🏔 地元割</button>
    </div>
    <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">${cartHtml}</div>
    <div class="total-area">
      <div class="subtotal-rows">${discHtml}</div>
      <div class="total-row-big">
        <div class="total-lbl">合計（税込）</div>
        <div class="total-val">${fmt(total)}</div>
      </div>
    </div>
    <div class="checkout-area">
      <div class="checkout-lbl">支払方法を選択して会計</div>
      <div class="pay-btns">
        <button class="pay-btn cash" ${!hasCart?'disabled':''} onclick="openCheckout('cash')">
          <span class="pay-ico">💴</span><span class="pay-lbl">現金</span>
        </button>
        <button class="pay-btn paypay" ${!hasCart?'disabled':''} onclick="openCheckout('paypay')">
          <span class="pay-ico">🔴</span><span class="pay-lbl">PayPay</span>
        </button>
        <button class="pay-btn qr" ${!hasCart?'disabled':''} onclick="openCheckout('qr')">
          <span class="pay-ico">💳</span><span class="pay-lbl">R Pay</span>
        </button>
      </div>
    </div>`;
}

// ══════════════════════════════════════════
//  日次集計 描画
// ══════════════════════════════════════════
function renderDailySummary() {
  const s = getMergedSummary();
  const isGas = !!gasSummary;
  const html = `
    <div class="daily-item"><div class="daily-lbl">本日合計${isGas?'🔄':''}</div><div class="daily-val">${fmt(s.total)}</div></div>
    <div class="daily-item"><div class="daily-lbl">💴 現金</div><div class="daily-val">${fmt(s.cash)}</div></div>

}
function closePriceModal() {
  document.getElementById('price-modal').style.display = 'none';
}
function pmKey(k) {
  if (k === 'C') { pmVal = ''; }
  else if (k === 'D') { pmVal = pmVal.slice(0, -1); }
  else if (pmVal.length < 6) { pmVal += k; }
  updatePmDisplay();
}
function updatePmDisplay() {
  const d = document.getElementById('pm-display');
  const ok = document.getElementById('pm-ok');
  const n = parseInt(pmVal, 10);
  if (!pmVal) {
    d.textContent = '金額を入力';
    d.classList.add('empty');
  } else {
    d.textContent = fmt(n);
    d.classList.remove('empty');
  }
  ok.disabled = !pmVal || n <= 0;
}
function confirmPrice() {
  const price = parseInt(pmVal, 10);
  if (!price || price <= 0) return;
  // 生わさびは都度追加（同じ金額でもわかるよう個別エントリ化）
  // 同IDが既にある場合は数量+1、単価は最新で上書き（簡易対応）
  const ex = cart.find(c => c.id === 'fresh_wasabi');
  if (ex) {
    // 複数個: 合算金額で管理
    ex.totalPrice = (ex.totalPrice || ex.unitPrice) + price;
    ex.qty++;
    ex.unitPrice = Math.round(ex.totalPrice / ex.qty);
  } else {
    cart.push({ id:'fresh_wasabi', name:'生わさび', qty:1, unitPrice:price, disc:0, totalPrice:price });
  }
  closePriceModal();
  renderAll();
}

function openCheckout(payment) {
  if (!cart.length) return;
  currentPayment = payment;
  const { subtotal, discount, total } = calcTotals();
  const isCash = payment === 'cash';

  // ヘッダー
  const head = document.getElementById('cm-head');
  head.className = `cm-head ${payment}`;
  const ico   = payment==='cash' ? '💴' : payment==='paypay' ? '🔴' : '💳';
  const title = payment==='cash' ? '現金 会計' : payment==='paypay' ? 'PayPay 会計' : 'R Pay 会計';
  const sub   = payment==='cash' ? '現金でのお支払い' : payment==='paypay' ? 'PayPayでのお支払い' : 'R Payでのお支払い';
  setTxt('cm-ico', ico);
  setTxt('cm-title', title);
  setTxt('cm-subtitle', sub);
  setTxt('cm-total-val', fmt(total));

  // お釣り計算エリア（現金のみ）
  const ca = document.getElementById('change-area');
  ca.style.display = isCash ? 'block' : 'none';
  if (isCash) {
    document.getElementById('received-input').value = '';
    document.getElementById('change-result').classList.remove('show');
    // クイック金額ボタン生成
    const bills = [1000, 2000, 5000, 10000].filter(b => b >= total);
    // ちょうど払い
    const quickAmounts = [total, ...bills];
    const seen = new Set();
    const uniq = quickAmounts.filter(v => {
      if (seen.has(v)) return false;
      seen.add(v); return true;
    });
    document.getElementById('quick-bills').innerHTML = uniq.map(v =>
      `<button class="bill-btn" onclick="setReceived(${v})">${v === total ? 'ちょうど' : fmt(v)}</button>`
    ).join('');
  }

  // 注文明細
  const rows = cart.map(item => {
    const disc = isLocal ? item.disc : 0;
    return `<div class="cm-item-row">
      <span>${item.name} × ${item.qty}</span>
      <span>${fmt((item.unitPrice - disc) * item.qty)}</span>
    </div>`;
  }).join('');
  const discRow = discount > 0 ? `<div class="cm-item-row cm-item-disc"><span>🏔 地元割引</span><span>-${fmt(discount)}</span></div>` : '';
  document.getElementById('cm-items-list').innerHTML = rows + discRow;

  document.getElementById('checkout-modal').style.display = 'flex';
}

function setReceived(amount) {
  document.getElementById('received-input').value = amount;
  calcChange();
}

function calcChange() {
  const { total } = calcTotals();
  const received = parseInt(document.getElementById('received-input').value, 10) || 0;
  const result = document.getElementById('change-result');
  if (received >= total) {
    result.classList.add('show');
    setTxt('change-val', fmt(received - total));
  } else {
    result.classList.remove('show');
  }
}

//  会計完了
// ══════════════════════════════════════════
function closeCheckout() {
  document.getElementById('checkout-modal').style.display = 'none';
  currentPayment = null;
}

async function completeCheckout() {
  const { subtotal, discount, total } = calcTotals();
  const now = new Date();

  const order = {
    no: todayData.nextNo,
    time: now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
    payment: currentPayment,
    isLocal,
    items: cart.map(c => ({ id:c.id, name:c.name, qty:c.qty, unitPrice:c.unitPrice, disc:c.disc })),
    subtotal, discount, total,
    date: todayStr(),
    timestamp: now.toISOString()
  };

  todayData.orders.push(order);
  todayData.nextNo++;
  saveTodayData();

  // モーダルを閉じてリセット
  document.getElementById('checkout-modal').style.display = 'none';
  cart = [];
  setLocal(false); // 地元割をUIごとリセット
  renderAll();
  updateOrderNo();

}

async function sendToGAS(order) {
  try {
    const params = new URLSearchParams({
      action: 'addRegisterOrder',
      date: order.date,
      time: order.time,
      orderNo: order.no,
      payment: order.payment,
      isLocal: order.isLocal,
      subtotal: order.subtotal,
      discount: order.discount,
      total: order.total,
      items: JSON.stringify(order.items)
    });
    await fetch(`${GAS_URL}?${params}`, { method: 'GET', mode: 'no-cors' });
  } catch (e) {
    console.warn('GAS送信エラー:', e);
  }
}

// 全注文の商品・金額を合算して売上管理形式に変換
function buildMergedItems() {
  const orders = todayData.orders;
  const items = {};
  let shokudoTotal = 0, coffeeTotal = 0, buppanTotal = 0;
  let cashTotal = 0, paypayTotal = 0, qrTotal = 0, total = 0;

  orders.forEach(order => {
    // 支払区分集計
    if (order.payment === 'cash')   cashTotal   += order.total;
    if (order.payment === 'paypay') paypayTotal += order.total;
    if (order.payment === 'qr')     qrTotal     += order.total;
    total += order.total;

    // 商品集計
    order.items.forEach(item => {
      if (!items[item.id]) items[item.id] = { qty: 0 };
      items[item.id].qty += item.qty;

      // 部門別合計（地元割引後の実売上で集計）
      const disc = order.isLocal ? item.disc : 0;
      const lineTotal = (item.unitPrice - disc) * item.qty;
      const prod = findProd(item.id);
      const div = prod?.div || 'buppan';
      if (div === 'shokudo')      shokudoTotal += lineTotal;
      else if (div === 'coffee')  coffeeTotal  += lineTotal;
      else                        buppanTotal  += lineTotal;
    });
  });

  return {
    items,
    shokudoTotal, coffeeTotal, buppanTotal,
    // 後方互換
    foodTotal: shokudoTotal, drinkTotal: coffeeTotal, merchTotal: buppanTotal,
    cashTotal, paypayTotal, qrTotal, total
  };
}

// 売上管理アプリのlocalStorageに書き込み
async function executeSend() {
  const orders = todayData.orders;
  if (!orders.length) return;

  const loc   = document.getElementById('send-loc').value;
  const event = document.getElementById('send-event').value.trim();
  const memo  = document.getElementById('send-memo').value.trim();

  // ボタンをローディング状態に
  const btn = document.getElementById('send-ok-btn');
  btn.disabled = true;
  btn.className = 'send-ok sending';
  document.getElementById('send-ok-ico').textContent = '⏳';
  document.getElementById('send-ok-txt').textContent = '送信中…';

  try {
    const merged = buildMergedItems();

    // 売上管理アプリ形式のレコードを生成
    const record = {
      id: `reg_${todayData.date}_${Date.now()}`,
      date: todayData.date,
      loc,
      event: loc === 'イベント' ? event : '',
      weather: sendWeather,
      memo,
      items: merged.items,
      shokudoTotal: merged.shokudoTotal,
      coffeeTotal:  merged.coffeeTotal,
      buppanTotal:  merged.buppanTotal,
      // 後方互換
      foodTotal:    merged.shokudoTotal,
      drinkTotal:   merged.coffeeTotal,
      merchTotal:   merged.buppanTotal,
      cashTotal:    merged.cashTotal,
      paypayTotal:  merged.paypayTotal,
      qrTotal:      merged.qrTotal,
      total:        merged.total,
      source: 'register'
    };

    // 売上管理アプリの localStorage に追加
    // wasabi_v3 は records配列を直接保存している形式
    const raw = localStorage.getItem(SALES_APP_KEY);
    let records = (raw ? JSON.parse(raw) : null);
    // 配列でない場合（初回など）は空配列に
    if (!Array.isArray(records)) records = [];

    // 同日・registerソースの重複チェック
    const dupIdx = records.findIndex(
      r => r.date === record.date && r.source === 'register'
    );
    if (dupIdx >= 0) {
      if (!confirm(`${record.date} のレジデータが既に存在します。上書きしますか？`)) {
        btn.disabled = false;
        btn.className = 'send-ok';
        document.getElementById('send-ok-ico').textContent = '📤';
        document.getElementById('send-ok-txt').textContent = '売上管理に送る';
        return;
      }
      records.splice(dupIdx, 1);
    }
    records.push(record);
    localStorage.setItem(SALES_APP_KEY, JSON.stringify(records));

    // 完了表示
    document.getElementById('sent-banner').classList.add('show');
    btn.className = 'send-ok';
    document.getElementById('send-ok-ico').textContent = '✅';
    document.getElementById('send-ok-txt').textContent = '送信完了！';

    showToast(`売上管理に送信しました ${fmt(record.total)}`);

    // GASにも送信（URL設定済みの場合）
    if (GAS_URL) sendRecordToGAS(record);

  } catch(e) {
    console.error(e);
    showToast('送信エラーが発生しました');
    btn.disabled = false;
    btn.className = 'send-ok';
    document.getElementById('send-ok-ico').textContent = '📤';
    document.getElementById('send-ok-txt').textContent = '売上管理に送る';
  }
}

}

        ${checked ? `<div class="preset-order-btns">
          <button class="preset-ob" onclick="movePresetItem(${pi},'${p.id}',-1)" title="上へ">↑</button>
          <button class="preset-ob" onclick="movePresetItem(${pi},'${p.id}',1)" title="下へ">↓</button>
        </div>` : '<div style="width:55px"></div>'}
      </div>`;
    }).join('');

    return `<div class="preset-section">
      <div class="preset-section-head">
        <span class="preset-section-title">${preset.icon} ${preset.label}（${preset.items.length}品）</span>
        <button class="preset-rename-btn" onclick="renamePreset(${pi})">名前変更</button>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

function togglePresetItem(presetIdx, id, checked) {
  const preset = presets[presetIdx];
  if (checked) {
    if (!preset.items.includes(id)) preset.items.push(id);
  } else {
    preset.items = preset.items.filter(x => x !== id);
  }
  savePresets(presets);
  renderPresetEditor(document.getElementById('master-list'));
  // アクティブプリセットなら商品グリッドも更新
  if (activeCat === `preset-${presetIdx}`) renderGrid();
}

function movePresetItem(presetIdx, id, dir) {
  const preset = presets[presetIdx];
  const idx = preset.items.indexOf(id);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= preset.items.length) return;
  [preset.items[idx], preset.items[newIdx]] = [preset.items[newIdx], preset.items[idx]];
  savePresets(presets);
  renderPresetEditor(document.getElementById('master-list'));
  if (activeCat === `preset-${presetIdx}`) renderGrid();
}

function renamePreset(presetIdx) {
  const preset = presets[presetIdx];
  const newName = prompt(`プリセット名を入力してください`, preset.label);
  if (!newName || !newName.trim()) return;
  preset.label = newName.trim();
  savePresets(presets);
  applyPresetLabels();
  renderPresetEditor(document.getElementById('master-list'));
}

function openMasterEdit(id) {
  const isNew = !id;
  document.getElementById('medit-title').textContent = isNew ? '商品を追加' : '商品を編集';
  document.getElementById('medit-orig-id').value = id || '';

  if (isNew) {
    document.getElementById('medit-id').value    = '';
    document.getElementById('medit-name').value  = '';
    document.getElementById('medit-price').value = '';
    document.getElementById('medit-disc').value  = '0';
    document.getElementById('medit-cat').value   = masterCat;
    document.getElementById('medit-div').value   = masterCat === 'ドリンク' || masterCat === '物販' ? 'coffee' : 'shokudo';
  } else {
    const p = ALL_PRODS.find(x => x.id === id);
    if (!p) return;
    document.getElementById('medit-id').value    = p.id;
    document.getElementById('medit-name').value  = p.name;
    document.getElementById('medit-price').value = p.price === null ? '' : p.price;
    document.getElementById('medit-disc').value  = p.disc || 0;
    document.getElementById('medit-cat').value   = masterCat;
    document.getElementById('medit-div').value   = p.div || 'shokudo';
  }
  document.getElementById('medit-modal').style.display = 'flex';
}

function closeMasterEdit() {
  document.getElementById('medit-modal').style.display = 'none';
}

function saveMasterItem() {
  const name    = document.getElementById('medit-name').value.trim();
  const priceRaw = document.getElementById('medit-price').value.trim();
  const disc    = parseInt(document.getElementById('medit-disc').value) || 0;
  const cat     = document.getElementById('medit-cat').value;
  const div     = document.getElementById('medit-div').value;
  const origId  = document.getElementById('medit-orig-id').value;

  if (!name) { showToast('商品名を入力してください'); return; }

  const price = priceRaw === '' ? null : parseInt(priceRaw);
  // IDは既存のものを使うか、名前からスネークケース生成
  const id = origId || 'custom_' + Date.now();

  const newProd = { id, name, price, disc, div };

  // PRODSを更新
  if (origId) {
    // 元のカテゴリから削除（カテゴリ変更対応）
    Object.keys(PRODS).forEach(c => {
      PRODS[c] = PRODS[c].filter(p => p.id !== origId);
    });
  }
  if (!PRODS[cat]) PRODS[cat] = [];
  PRODS[cat].push(newProd);

  // ALL_PRODSを再構築
  ALL_PRODS.length = 0;
  Object.values(PRODS).flat().forEach(p => ALL_PRODS.push(p));

  // カスタム商品をlocalStorageに保存
  const custom = loadCustomProds();
  if (!custom[cat]) custom[cat] = [];
  // 既存エントリを更新
  const cidx = custom[cat].findIndex(p => p.id === id);
  if (cidx >= 0) custom[cat][cidx] = newProd;
  else custom[cat].push(newProd);
  // 旧カテゴリからも削除
  if (origId && origId !== id) {
    Object.keys(custom).forEach(c => {
      custom[c] = (custom[c] || []).filter(p => p.id !== origId);
    });
  }
  saveCustomProds(custom);

  closeMasterEdit();
  masterCat = cat;
  document.querySelectorAll('.master-cat-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.mcat === cat)
  );
  renderMasterList();
  renderGrid(); // 商品グリッドも更新
  showToast(`「${name}」を保存しました`);
}

function deleteMasterItem(id, cat) {
  const p = ALL_PRODS.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`「${p.name}」を削除しますか？`)) return;

  PRODS[cat] = (PRODS[cat] || []).filter(x => x.id !== id);
  ALL_PRODS.length = 0;
  Object.values(PRODS).flat().forEach(x => ALL_PRODS.push(x));

  // カスタム商品から削除
  const custom = loadCustomProds();
  Object.keys(custom).forEach(c => {
    custom[c] = (custom[c] || []).filter(x => x.id !== id);
  });
  saveCustomProds(custom);

  renderMasterList();
  renderGrid();
  showToast(`「${p.name}」を削除しました`);
}

// ══════════════════════════════════════════
//  トースト
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════
//  初期化
// ══════════════════════════════════════════
function init() {
  applyCustomProds();
  presets = loadPresets();
  activeCat = 'preset-0';
  applyPresetLabels();
  renderAll();
  if (window.innerWidth < 768) {
    document.getElementById('right-col').style.display = 'none';
    spSwitch('menu');
  } else {
    document.getElementById('right-col').style.display = 'flex';
    document.getElementById('tab-pay-cash').disabled = true;
    document.getElementById('tab-pay-paypay').disabled = true;
    document.getElementById('tab-pay-qr').disabled = true;
  }
  // GASから日次集計・設定を取得
  fetchGasSummary(true);
  syncSettingsFromGAS(); // マスタ・プリセットをGASから同期
  setInterval(() => fetchGasSummary(), GAS_FETCH_INTERVAL);
}

window.addEventListener('resize', () => {
  const isTab = window.innerWidth >= 768;
  document.getElementById('right-col').style.display = isTab ? 'flex' : 'none';
});

init();
</script>
</body>
